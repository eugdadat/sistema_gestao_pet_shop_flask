<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PetVida - Gestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .card-link { transition: 0.3s; text-decoration: none; color: white !important; }
        .card-link:hover { transform: translateY(-5px); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">🐾 Sistema PetVida</h1>
        <div class="row g-4 justify-content-center">
            <div class="col-md-3"><a href="/clientes" class="card card-link bg-primary p-4 text-center shadow"><h3>👥</h3><h4>Clientes</h4></a></div>
            <div class="col-md-3"><a href="/pets" class="card card-link bg-success p-4 text-center shadow"><h3>🐶</h3><h4>Pets</h4></a></div>
            <div class="col-md-3"><a href="/servicos" class="card card-link bg-warning p-4 text-center shadow"><h3>✂️</h3><h4>Serviços</h4></a></div>
            <div class="col-md-3"><a href="/produtos" class="card card-link bg-info p-4 text-center shadow"><h3>🛒</h3><h4>Produtos</h4></a></div>
        </div>
    </div>
</body>
</html>
