<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PetVida - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>👥 Gestão de Clientes</h2>
            <a href="/" class="btn btn-outline-secondary">Voltar ao Painel</a>
        </div>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h5 class="card-title">Cadastrar Novo Cliente</h5>
                <form method="POST" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Nome Completo</label>
                        <input name="nome" class="form-control" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Telefone</label>
                        <input name="telefone" class="form-control" placeholder="(11) 99999-9999" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">E-mail</label>
                        <input name="email" type="email" class="form-control" placeholder="joao@email.com" required>
                    </div>
                    <div class="col-12 text-end">
                        <button type="submit" class="btn btn-primary px-4">Salvar Cliente</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover bg-white shadow-sm rounded">
                <thead class="table-primary">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>E-mail</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in clientes %}
                    <tr>
                        <td><span class="badge bg-secondary">{{c.id}}</span></td>
                        <td><strong>{{c.nome}}</strong></td>
                        <td>{{c.telefone}}</td>
                        <td>{{c.email}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
