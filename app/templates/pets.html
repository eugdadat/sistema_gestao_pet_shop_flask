<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PetVida - Pets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🐶 Gestão de Pets</h2>
            <a href="/" class="btn btn-outline-secondary">Voltar ao Painel</a>
        </div>

        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h5 class="card-title">Cadastrar Novo Pet</h5>
                <form method="POST" class="row g-3">
                    <div class="col-md-3">
                        <input name="nome" class="form-control" placeholder="Nome do Pet" required>
                    </div>
                    <div class="col-md-2">
                        <input name="tipo" class="form-control" placeholder="Tipo (Cão/Gato)" required>
                    </div>
                    <div class="col-md-2">
                        <input name="raca" class="form-control" placeholder="Raça">
                    </div>
                    <div class="col-md-2">
                        <input name="idade" type="number" class="form-control" placeholder="Idade">
                    </div>
                    <div class="col-md-3">
                        <select name="cliente_id" class="form-select" required>
                            <option value="" disabled selected>Selecione o Dono</option>
                            {% for c in clientes %}
                            <option value="{{c.id}}">{{c.nome}}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-success w-100">Cadastrar Pet</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover bg-white shadow-sm rounded">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Raça</th>
                        <th>Idade</th>
                        <th>Dono (ID)</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in pets %}
                    <tr>
                        <td>{{p.nome}}</td>
                        <td>{{p.tipo}}</td>
                        <td>{{p.raca}}</td>
                        <td>{{p.idade}} anos</td>
                        <td><span class="badge bg-secondary">{{p.cliente_id}}</span></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
